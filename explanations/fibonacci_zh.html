      <section class="content-box">
        <h2>什么是黄金螺旋？</h2>
        <p>黄金螺旋是一种等角螺线，其增长因子为 φ（黄金比例）。它每旋转四分之一圈，半径就会增加 φ 倍。</p>
        
        <div class="math-block">
          φ = (1 + √5) / 2 ≈ 1.618
        </div>

        <h2>斐波那契数列的联系</h2>
        <p>黄金螺旋可以通过在斐波那契正方形平铺中绘制四分之一圆弧来近似。这些正方形的边长遵循斐波那契数列：1, 1, 2, 3, 5, 8, 13, 21 等。</p>
        
        <h2>自然界中的美</h2>
        <p>黄金螺旋和斐波那契数列在自然界中随处可见，从向日葵种子的排列到星系的螺旋臂，再到鹦鹉螺的外壳形状。这种比例通常被认为在视觉上是和谐且平衡的。</p>
