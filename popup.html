    <title>Math Wonder Box</title>
    <link rel="stylesheet" href="css/popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <p class="eyebrow" data-i18n="extension_name">Math Wonder Box</p>

      <button id="restoreMathNewTab" type="button" data-i18n="popup_button_restore">Switch to My New Tab</button>
      <button id="toggleTheme" type="button">Toggle Theme</button>
      
      <footer class="popup-footer">
        <a href="https://hugbear.ai" target="_blank" data-i18n="footer_more_tools">More Tools</a>
        <span class="divider">|</span>
        <a href="https://ko-fi.com/qiyuanyang" target="_blank">
          ❤️ <span data-i18n="footer_buy_coffee">Buy me a coffee</span>

    <script src="js/popup.js"></script>
  </body>
</html>
